{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-background flex flex-col items-center justify-center pt-16 pb-24 px-4 sm:px-6">

    <!-- ── Contenedor Formulario ──────────────────────────── -->
    <div
        class="w-full max-w-2xl flex flex-col justify-center px-6 sm:px-12 py-16 bg-card border border-border shadow-2xl">

        <!-- Encabezado -->
        <div class="mb-10 text-center">
            <p class="text-[10px] uppercase tracking-[0.4em] text-muted-foreground mb-3">Datos de envío</p>
            <h1 class="font-[var(--font-display)] text-5xl tracking-[0.05em] uppercase leading-none">
                Completa<br>Tu Perfil
            </h1>
            <div class="w-12 h-[2px] bg-primary mt-5 mx-auto"></div>
        </div>

        <!-- Formulario -->
        <form method="POST" class="space-y-8" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <!-- Teléfono -->
            <div class="space-y-2">
                <label for="telefono" class="flex items-center justify-between">
                    <span
                        class="text-[10px] uppercase tracking-[0.3em] font-semibold text-muted-foreground">Teléfono</span>
                    <span class="text-[10px] text-muted-foreground/50">10 dígitos · requerido</span>
                </label>
                <input type="tel" name="telefono" id="telefono" required maxlength="10" placeholder="5512345678"
                    class="w-full bg-transparent border-0 border-b border-border text-foreground text-xl tracking-widest py-3 placeholder:text-muted-foreground/20 focus:outline-none focus:border-primary transition-colors duration-300">
            </div>

            <!-- Dirección -->
            <div class="space-y-2">
                <label for="direccion" class="flex items-center justify-between">
                    <span class="text-[10px] uppercase tracking-[0.3em] font-semibold text-muted-foreground">Dirección
                        de entrega</span>
                    <span class="text-[10px] text-muted-foreground/50">requerida</span>
                </label>
                <textarea name="direccion_completa" id="direccion" required rows="3"
                    placeholder="Calle, Núm. ext/int, Colonia, C.P., Ciudad..."
                    class="w-full bg-transparent border-0 border-b border-border text-foreground text-sm py-3 placeholder:text-muted-foreground/20 focus:outline-none focus:border-primary transition-colors duration-300 resize-none leading-relaxed"></textarea>
            </div>

            <!-- Nota -->
            <p class="text-[11px] text-muted-foreground leading-relaxed text-center">
                Solo utilizamos esta información para coordinar la entrega de tus pedidos.
                Nunca la compartiremos con terceros.
            </p>

            <!-- CTA -->
            <div class="pt-4">
                <button type="submit"
                    class="group relative w-full border border-foreground py-5 px-8 font-[var(--font-display)] text-2xl tracking-[0.2em] uppercase overflow-hidden transition-all duration-500 hover:text-background flex items-center justify-center gap-4">
                    <!-- Fill animado -->
                    <span
                        class="absolute inset-0 bg-foreground origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-500 ease-out z-0"></span>
                    <span class="relative z-10 transition-colors duration-200">Guardar y Continuar</span>
                    <i data-lucide="arrow-right"
                        class="relative z-10 w-5 h-5 transform group-hover:translate-x-2 transition-transform duration-300"></i>
                </button>
            </div>

        </form>

        <!-- Footer pequeño -->
        <p class="mt-12 text-[10px] text-muted-foreground/40 uppercase tracking-widest text-center">
            Axis Streetwear © 2026 · Conexión segura
        </p>

    </div>

</div>
{% endblock %}
