<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Clothing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-background text-foreground antialiased min-h-screen">
    <div class="noise-overlay"></div>

    {% include 'components/_header.html' %}

    {# Cart Drawer - must be OUTSIDE <main> to avoid DOM nesting issues #}
        {% include 'components/_cart_drawer.html' %}

        <main class="relative">
            {% block content %}{% endblock %}
        </main>

        {% include 'components/_footer.html' %}

        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        <script>
            // Initialize Lucide icons
            lucide.createIcons();
        </script>
</body>

</html>
