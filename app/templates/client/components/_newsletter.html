<section id="newsletter-container" class="relative py-32 bg-background overflow-hidden">
    <!-- Background Text -->
    <div id="newsletter-bg-text" class="absolute top-1/2 left-0 -translate-y-1/2 pointer-events-none whitespace-nowrap">
        <span class="font-[var(--font-display)] text-[25vw] text-foreground/[0.02] tracking-[0.1em]">
            ÚNETE ÚNETE ÚNETE
        </span>
    </div>

    <div class="container mx-auto px-4 lg:px-8 relative z-10">
        <div id="newsletter-content" class="max-w-3xl mx-auto text-center">
            <span class="block text-primary text-sm tracking-[0.3em] uppercase mb-6 opacity-0 translate-y-12">
                Newsletter
            </span>

            <h2
                class="font-[var(--font-display)] text-5xl md:text-7xl lg:text-8xl tracking-[0.1em] mb-6 opacity-0 translate-y-12">
                SÉ EL PRIMERO
            </h2>

            <p class="text-muted-foreground text-lg md:text-xl mb-12 max-w-xl mx-auto opacity-0 translate-y-12">
                Acceso exclusivo a nuevos drops, ofertas especiales y contenido detrás de cámaras.
                Únete a la comunidad AXIS.
            </p>

            <div id="newsletter-success"
                class="p-8 border border-primary bg-primary/10 hidden opacity-0 translate-y-12">
                <p class="font-[var(--font-display)] text-2xl tracking-[0.2em] text-primary">
                    BIENVENIDO A LA FAMILIA
                </p>
                <p class="text-muted-foreground mt-2">
                    Revisa tu correo para confirmar tu suscripción.
                </p>
            </div>

            <form id="newsletter-form"
                class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto opacity-0 translate-y-12">
                <input id="newsletter-email" type="email" placeholder="tu@email.com" required
                    class="flex-1 bg-secondary border border-border px-6 py-4 text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary transition-colors" />
                <button type="submit"
                    class="px-8 py-4 bg-primary text-primary-foreground font-[var(--font-display)] text-xl tracking-[0.2em] hover:bg-primary/90 transition-colors">
                    UNIRSE
                </button>
            </form>

            <!-- Trust indicators -->
            <div
                class="mt-12 flex flex-wrap justify-center gap-8 text-muted-foreground text-sm opacity-0 translate-y-12">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                    Sin spam
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                    Drops exclusivos
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-primary" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                    Cancela cuando quieras
                </div>
            </div>
        </div>
    </div>

    <!-- Decorative elements -->
    <div class="absolute top-1/4 left-8 w-px h-32 bg-gradient-to-b from-primary to-transparent"></div>
    <div class="absolute bottom-1/4 right-8 w-px h-32 bg-gradient-to-t from-primary to-transparent"></div>
</section>
