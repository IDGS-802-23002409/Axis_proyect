{% extends "client/base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-background px-4">
    <div class="text-center max-w-lg">
        <!-- Glitch code number -->
        <div class="relative mb-6">
            <p
                class="font-[var(--font-display)] text-[10rem] md:text-[14rem] leading-none text-foreground/5 select-none tracking-tighter">
                {{ code }}
            </p>
            <p
                class="absolute inset-0 flex items-center justify-center font-[var(--font-display)] text-7xl md:text-9xl tracking-[0.05em] text-foreground">
                {{ code }}
            </p>
        </div>

        <div class="w-16 h-[2px] bg-primary mx-auto mb-8"></div>

        <h1 class="font-[var(--font-display)] text-3xl md:text-4xl tracking-[0.15em] mb-4 uppercase">
            {{ title }}
        </h1>
        <p class="text-muted-foreground mb-10 leading-relaxed text-sm md:text-base">
            {{ message }}
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/"
                class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-primary text-primary-foreground font-[var(--font-display)] text-lg tracking-[0.2em] hover:bg-primary/90 transition-colors">
                <i data-lucide="home" class="w-5 h-5"></i>
                INICIO
            </a>
            <a href="/catalogo"
                class="inline-flex items-center justify-center gap-2 px-8 py-4 border border-border hover:border-primary hover:text-primary font-[var(--font-display)] text-lg tracking-[0.2em] transition-colors">
                <i data-lucide="grid" class="w-5 h-5"></i>
                CATÁLOGO
            </a>
        </div>

        <p class="mt-12 text-xs text-muted-foreground/50 tracking-[0.3em] uppercase">
            Axis Urban Apparel &mdash; Error {{ code }}
        </p>
    </div>
</div>
{% endblock %}
