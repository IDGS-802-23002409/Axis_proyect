<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; background-color: #000000; font-family: 'Helvetica Neue', Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #000000; padding: 30px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #111111; border: 1px solid #222;">

                    <!-- Header con imagen -->
                    <tr>
                        <td style="padding: 0;">
                            <img src="{{ url_for('static', filename='images/header-correo.png', _external=True) }}"
                                alt="Axis Urban Apparel" width="600" style="display: block; width: 100%; height: auto;">
                        </td>
                    </tr>

                    <!-- Contenido -->
                    <tr>
                        <td style="padding: 40px 40px 20px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px 30px; border-top: 1px solid #222;">
                            <p style="color: #555; font-size: 12px; margin: 0; text-align: center;">
                                © 2026 Axis Urban Apparel. Todos los derechos reservados.
                            </p>
                            <p style="color: #444; font-size: 11px; margin: 5px 0 0; text-align: center;">
                                Este es un correo automático, no respondas a este mensaje.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
