{% extends "security/email/base_email.html" %}

{% block content %}
<h1
    style="color: #ffffff; font-size: 24px; margin: 0 0 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">
    ¡Bienvenido a Axis!
</h1>

<p style="color: #cccccc; font-size: 16px; line-height: 1.6; margin: 0 0 25px;">
    Tu cuenta ha sido confirmada exitosamente. Ya puedes iniciar sesión en <strong style="color: #fff;">Axis Urban
        Apparel</strong>.
</p>

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding: 10px 0 30px;">
            <a href="{{ url_for('security.login', _external=True) }}" style="display: inline-block; background-color: #ffffff; color: #000000; text-decoration: none;
                       padding: 14px 40px; font-size: 14px; font-weight: bold; text-transform: uppercase;
                       letter-spacing: 2px;">
                INICIAR SESIÓN
            </a>
        </td>
    </tr>
</table>

<p style="color: #777; font-size: 13px; line-height: 1.5; margin: 0;">
    Gracias por unirte a la comunidad Axis.
</p>
{% endblock %}
