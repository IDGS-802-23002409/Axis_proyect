<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Axis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/security.css') }}">
</head>

<body>
    <div class="security-container">
        <div class="side-logo">
            <div class="urban-bg-text pos-1">AXIS</div>
            <img src="{{ url_for('static', filename='images/urban-bg.png') }}" alt="Axis Urban">
            <div class="graffiti-drip" style="left: 30%; animation-delay: 0.5s;"></div>
            <div class="graffiti-drip" style="left: 60%; animation-delay: 1.2s;"></div>
        </div>
        <div class="side-form">
            <div class="urban-bg-text pos-2">STREET</div>
            <div class="form-wrapper">
                <h1>LOGIN</h1>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="username">Usuario / Email</label>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Escribe tu usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="********"
                            required>
                    </div>
                    <button type="submit" class="btn-urban">ENTRAR</button>
                    <div style="margin-top: 20px; text-align: center; font-size: 0.8rem;">
                        <a href="/security/register-preview"
                            style="color: #fff; text-decoration: none; opacity: 0.7;">¿No tienes cuenta? <span
                                style="text-decoration: underline;">Regístrate</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
