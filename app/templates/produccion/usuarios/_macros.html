{% macro fieldUser(field, classes, rows=none) %}
<div>
  <label class="block text-sm font-medium mb-1">
    {{ field.label }}
  </label>

  {% if rows %}
  {{ field(class=classes, rows=rows) }}
  {% else %}
  {{ field(class=classes) }}
  {% endif %}

  {% for error in field.errors %}
  <p class="text-red-500 text-xs mt-1">{{ error }}</p>
  {% endfor %}
</div>
{% endmacro %}
