{% extends "produccion/layout.html" %}

{% block content %}
<div class="max-w-[1400px] mx-auto">
    <div class="flex justify-between items-center mb-10">
        <div>
            <h1 class="text-3xl font-black text-black uppercase tracking-tighter italic">Panel de Control</h1>
            <p class="text-gray-500 text-sm font-medium mt-1">Monitorea alertas de inventario y estados de producción en tiempo real.</p>
        </div>
        
        <div class="flex gap-4">
            <button class="bg-[#111] border border-gray-800 text-gray-300 px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-gray-800 transition-all flex items-center gap-2">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i> ACTUALIZAR
            </button>
            <button class="bg-white text-black px-6 py-2.5 rounded-xl text-xs font-black hover:bg-gray-200 transition-all flex items-center gap-2">
                <i data-lucide="file-down" class="w-4 h-4"></i> GENERAR REPORTE
            </button>
        </div>
    </div>

    {% include "alertas/_kpis_alertas.html" %}

    {% include "alertas/_tabla_criticos.html" %}
</div>
{% endblock %}
