<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    // Inicializar íconos
    if (window.lucide) {
        lucide.createIcons();
    }

    // --- MODALES: EVENT LISTENERS ---
    document.addEventListener('click', function (e) {
        // DETALLES
        if (e.target.closest('.details-trigger')) {
            const uid = e.target.closest('.details-trigger').dataset.uid;
            verDetalles(uid);
        }
        // EDITAR
        if (e.target.closest('.edit-trigger')) {
            const uid = e.target.closest('.edit-trigger').dataset.uid;
            abrirEditar(uid);
        }
        // ELIMINAR
        if (e.target.closest('.delete-trigger')) {
            const uid = e.target.closest('.delete-trigger').dataset.uid;
            abrirEliminar(uid);
        }
    });

    async function verDetalles(uid) {
        try {
            const res = await fetch(`/proveedores/${uid}?format=json`);
            const data = await res.json();
            if (data.uuid) {
                document.getElementById('det-razon-social').textContent = data.razon_social;
                document.getElementById('det-rfc').textContent = data.rfc;
                document.getElementById('det-telefono').textContent = data.telefono || '---';
                document.getElementById('det-categoria').textContent = data.categoria_insumo || '---';
                document.getElementById('det-contacto').textContent = data.contacto_nombre || '---';
                document.getElementById('det-estatus').textContent = data.estatus ? 'ACTIVO' : 'INACTIVO';
                document.getElementById('det-fecha-creacion').textContent = data.fecha_creacion;
                document.getElementById('det-fecha-actualizacion').textContent = data.fecha_actualizacion;
                document.getElementById('det-usuario-creo').textContent = data.usuario_creo;

                document.getElementById('modal-detalles').classList.remove('hidden');
            }
        } catch (err) {
            console.error("Error al cargar detalles:", err);
        }
    }

    async function abrirEditar(uid) {
        try {
            const res = await fetch(`/proveedores/${uid}?format=json`);
            const data = await res.json();
            if (data.uuid) {
                const form = document.getElementById('form-update');
                form.action = `/proveedores/editar/${uid}`;

                document.getElementById('upd_razon_social').value = data.razon_social;
                document.getElementById('upd_rfc').value = data.rfc;
                document.getElementById('upd_telefono').value = data.telefono || '';
                document.getElementById('upd_categoria').value = data.categoria_insumo || '';
                document.getElementById('upd_contacto').value = data.contacto_nombre || '';
                document.getElementById('upd_estatus').checked = data.estatus;

                document.getElementById('modal-update').classList.remove('hidden');
            }
        } catch (err) {
            console.error("Error al cargar datos para editar:", err);
        }
    }

    function abrirEliminar(uid) {
        const form = document.getElementById('form-delete');
        form.action = `/proveedores/eliminar/${uid}`;
        document.getElementById('modal-delete').classList.remove('hidden');
    }

    // ── Configuración de la Gráfica (Solo si existe el canvas) ──────
    const chartCanvas = document.getElementById('salesChart');
    if (chartCanvas) {
        const ctx = chartCanvas.getContext('2d');
        const labels = {{ (chart_labels | default ([])) | tojson
    }};
    const dataVentas = {{ (chart_data | default ([])) | tojson }};

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Registros',
                data: dataVentas,
                borderColor: '#111827',
                backgroundColor: 'rgba(17, 24, 39, 0.05)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointBackgroundColor: '#111827'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f3f4f6' }, ticks: { size: 10, color: '#9ca3af' } },
                x: { grid: { display: false }, ticks: { size: 10, color: '#9ca3af' } }
            }
        }
    });
    }

    // --- FILTRADO DE TABLA (CLIENT-SIDE) ---
    document.addEventListener("DOMContentLoaded", function () {
        // Auto-abrir modal si hay errores (pasado desde Flask)
        const modalToOpen = "{{ modal_to_open }}";
        if (modalToOpen) {
            const m = document.getElementById(modalToOpen);
            if (m) m.classList.remove('hidden');
        }

        const searchInput = document.getElementById("input-search");
        const statusSelect = document.getElementById("select-status");

        if (searchInput && statusSelect) {
            function filterTable() {
                const query = searchInput.value.toLowerCase();
                const statusQuery = statusSelect.value;
                const rows = document.querySelectorAll("tbody tr:not(#no-results-row)");
                let count = 0;

                rows.forEach(row => {
                    const razon = row.querySelector("td:nth-child(1)").textContent.toLowerCase();
                    const rfc = row.querySelector("td:nth-child(3)").textContent.toLowerCase();
                    const statusText = row.querySelector("td:nth-child(5)").textContent.toLowerCase().trim();
                    const rowStatus = statusText.includes('inactivo') ? 'inactivo' : 'activo';

                    const matchesSearch = razon.includes(query) || rfc.includes(query);
                    const matchesStatus = statusQuery === 'all' || rowStatus === statusQuery;

                    if (matchesSearch && matchesStatus) {
                        row.style.display = "";
                        count++;
                    } else {
                        row.style.display = "none";
                    }
                });

                const noResults = document.getElementById("no-results-row");
                if (noResults) {
                    if (count > 0) {
                        noResults.classList.add("hidden");
                    } else {
                        noResults.classList.remove("hidden");
                    }
                }
            }

            searchInput.addEventListener("input", filterTable);
            statusSelect.addEventListener("change", filterTable);

            // Apply initial filter if any value is preset
            filterTable();
        }
    });

</script>
