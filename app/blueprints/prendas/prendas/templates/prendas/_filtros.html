{# prendas/_filtros.html — buscador inline del sidebar de prendas #}
<div class="px-3 py-2 border-b border-gray-100">
    <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-2.5 pointer-events-none"></i>
        <input
            type="text"
            id="buscador-prendas"
            placeholder="Buscar prenda o SKU..."
            autocomplete="off"
            class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-md
                   focus:outline-none focus:ring-1 focus:ring-blue-400
                   bg-gray-50 text-gray-700 placeholder-gray-400">
    </div>
</div>
