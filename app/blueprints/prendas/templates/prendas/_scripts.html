{# prendas/_scripts.html — JS del módulo de prendas #}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
(function () {
    'use strict';

    // ── Reiniciar Lucide tras cualquier inserción dinámica ────────
    const reinitLucide = () => lucide.createIcons();

    // ── Buscador de prendas en sidebar ───────────────────────────
    const buscador = document.getElementById('buscador-prendas');
    const items    = document.querySelectorAll('#lista-prendas li[data-searchable]');

    if (buscador && items.length) {
        buscador.addEventListener('input', () => {
            const q = buscador.value.toLowerCase().trim();
            items.forEach(li => {
                li.style.display = li.dataset.searchable.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    }

    // ── Preview de margen en tiempo real ─────────────────────────
    const inputPrecio = document.getElementById('input-precio');
    const margenSpan  = document.getElementById('margen-preview');
    const cogs        = parseFloat(document.getElementById('cogs-value')?.dataset.cogs || '0');

    function colorMargen(pct) {
        if (pct >= 50) return 'text-green-600';
        if (pct >= 30) return 'text-yellow-600';
        return 'text-red-500';
    }

    if (inputPrecio && margenSpan && cogs > 0) {
        inputPrecio.addEventListener('input', () => {
            const precio = parseFloat(inputPrecio.value) || 0;
            if (precio > 0) {
                const pct = ((precio - cogs) / precio) * 100;
                margenSpan.textContent = pct.toFixed(1) + '%';
                margenSpan.className   = 'text-sm font-black ' + colorMargen(pct);
            }
        });
    }

    // ── Botón "Ajustar Precios" → scroll + focus ─────────────────
    document.getElementById('btn-ajustar')?.addEventListener('click', () => {
        const form = document.getElementById('form-precio');
        if (form) {
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('input-precio')?.focus();
        }
    });

    // ── Donut de composición de costos ───────────────────────────
    const canvas = document.getElementById('donutCostos');
    if (canvas) {
        const mat  = parseFloat(canvas.dataset.materiales || 0);
        const conf = parseFloat(canvas.dataset.confeccion || 0);
        const merm = parseFloat(canvas.dataset.merma      || 0);

        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: ['Materiales', 'Confección', 'Merma'],
                datasets: [{
                    data: [mat, conf, merm],
                    backgroundColor: ['#3B82F6', '#9CA3AF', '#FBBF24'],
                    borderWidth: 0,
                    hoverOffset: 4,
                }],
            },
            options: {
                cutout: '72%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: ctx => ` $${ctx.parsed.toFixed(2)}`
                        }
                    }
                },
                animation: { animateScale: true },
            }
        });
    }

    reinitLucide();
})();
</script>
