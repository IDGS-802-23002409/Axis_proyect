{# prendas/modal_delete.html — confirmación de desactivación #}
<div id="modal-delete"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-950/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-8 text-center">

        <div class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-5">
            <i data-lucide="trash-2" class="w-7 h-7 text-red-500"></i>
        </div>

        <h3 class="text-lg font-black text-gray-950 uppercase tracking-tight">¿Desactivar prenda?</h3>
        <p class="text-sm text-gray-500 mt-2 leading-relaxed">
            La prenda <span class="font-bold text-gray-800">{{ prenda_activa.sku_especifico }}</span>
            será desactivada. No se eliminará del historial de ventas.
        </p>

        <div class="flex gap-3 mt-7">
            <button onclick="document.getElementById('modal-delete').classList.add('hidden')"
                class="flex-1 px-4 py-2.5 text-sm font-semibold text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                Cancelar
            </button>
            <form method="POST"
                  action="{{ url_for('prendas.eliminar', uuid_producto=prenda_activa.uuid_producto) }}"
                  class="flex-1">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit"
                    class="w-full px-4 py-2.5 text-sm font-bold bg-red-600 text-white rounded-xl hover:bg-red-700 transition-colors">
                    Sí, desactivar
                </button>
            </form>
        </div>
    </div>
</div>
